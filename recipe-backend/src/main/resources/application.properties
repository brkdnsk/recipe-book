# 1. Veritabanı Bağlantı Adresi (Port 5432 PostgreSQL'in standart portudur)
spring.datasource.url=jdbc:postgresql://localhost:5432/recipe_db

# 2. PostgreSQL Kullanıcı Adı (Genellikle varsayılanı 'postgres' olur)
spring.datasource.username=postgres

# 3. PostgreSQL Şifren (Kendi veritabanı şifreni buraya yazmalısın)
spring.datasource.password=sifreniz_buraya

# 4. Hibernate Ayarları: Java sınıflarını otomatik olarak tabloya dönüştürür ('update' yeni alanları ekler, veriyi silmez)
spring.jpa.hibernate.ddl-auto=update

# 5. SQL Sorgularını Konsolda Görme: Spring'in arka planda ürettiği SQL'leri terminalde görmek öğrenmek için harikadır
spring.jpa.show-sql=true

# 6. Veritabanı Diyalekti
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect